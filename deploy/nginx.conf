# nginx site config for 魔塔 24层 网页版.
#
# Two ways to use it:
#   A) pure static (no leaderboard): serve /var/www/mota directly.  Comment out
#      the /api/ block.
#   B) reverse proxy in front of mota-server (docker or systemd) on :8001,
#      which gives you HTTPS termination via certbot and keeps the API.
#
# Install:  cp deploy/nginx.conf /etc/nginx/sites-available/mota
#           ln -s /etc/nginx/sites-available/mota /etc/nginx/sites-enabled/mota
#           nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;               # put your domain here (needed for certbot)

    root /var/www/mota;
    index index.html;

    # small, cheap, cacheable: everything is text
    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # security headers (mirrors what mota-server sends)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # --- option B: leaderboard API served by mota-server -------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This config has one trusted proxy; discard client-supplied chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 10s;
        client_max_body_size 8k;
        limit_except GET POST { deny all; }
    }
}
